[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rooftop-solar"
version = "0.1.0"
description = "Code-compliant maximum PV system sizing for multifamily and commercial rooftops"
requires-python = ">=3.10"
dependencies = [
    "shapely>=2.0",
    "pyproj>=3.5",
    "requests>=2.28",
    "pyarrow>=14",
    "numpy>=1.24",
    "scipy>=1.11",
    "tifffile>=2023.7",
    "imagecodecs>=2023.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rooftop-solar = "rooftop_solar.cli:main"

[tool.setuptools.packages.find]
include = ["rooftop_solar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
